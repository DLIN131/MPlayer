name: Build & Release

on:
  push:
    branches: [main]
    # 只改說明文件不用發新版（不然 App 會跳出沒有內容的更新）
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_STORE_FILE: keystore/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :tv:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk MPlayer.apk
          cp tv/build/outputs/apk/release/tv-release.apk MPlayerTV.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MPlayer v1.0.${{ github.run_number }}
          make_latest: true
          # 手機版、電視版的 App 內更新各自用檔名挑自己的安裝檔
          files: |
            MPlayer.apk
            MPlayerTV.apk
          # 更新說明就是 commit 訊息
          body: |
            ${{ github.event.head_commit.message }}

            ---
            固定下載網址（永遠是最新版）：
            手機版：https://github.com/${{ github.repository }}/releases/latest/download/MPlayer.apk
            電視版：https://github.com/${{ github.repository }}/releases/latest/download/MPlayerTV.apk
            電腦版（Windows）：https://github.com/${{ github.repository }}/releases/latest/download/MPlayer-Windows.zip

  # 電腦版：Release 由上面的工作建立，這裡建好後把 zip 加進同一個 Release
  desktop:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build Windows app
        shell: pwsh
        run: |
          "window.APP_VERSION = ${{ github.run_number }}" | Set-Content -Encoding utf8 src/version.js
          npm ci --no-audit --no-fund
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version
          $env:APP_VERSION = "1.0.${{ github.run_number }}"
          node pack.js dist
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist/MPlayer-win32-x64/* -DestinationPath out/MPlayer-Windows.zip

      # 只加檔案，不改發布說明（Android 版的 App 內更新依檔名找自己的安裝檔，不受影響）
      - name: Attach desktop zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: desktop/out/MPlayer-Windows.zip

